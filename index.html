<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container form centered">
      <h2 class="header mb">Introduce yourself</h2>
      <div class="row mb">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required />
      </div>
      <div class="row mb">
        <div class="col">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
            required
          />
        </div>
        <div class="col">
          <label for="age">Age:</label>
          <input type="number" min="1" max="100" id="age" required />
        </div>
      </div>
      <div class="row mb">
        <label for="gender">Sex:</label>
        <input type="radio" id="male" name="gender" value="Male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female">Female</label>
      </div>
      <div class="row mb">
        <label for="colors">Choose favorite color:</label>
        <br />
        <select name="colors" id="colors">
          <option value="Red">Red</option>
          <option value="Orange">Orange</option>
          <option value="Yellow">Yellow</option>
          <option value="Green">Green</option>
          <option value="Blue">Blue</option>
          <option value="Indigo">Indigo</option>
          <option value="Violet">Violet</option>
        </select>
      </div>
      <div class="row mb">
        <label for="hobby">Hobby:</label><br />
        <input
          type="checkbox"
          id="doodling"
          name="doodling"
          value="Doodling"
        /><label>Doodling</label>
        <input
          type="checkbox"
          id="sim-racing"
          name="sim-racing"
          value="Sim racing"
        /><label>Sim Racing</label>
      </div>
      <div class="row mb">
        <label for="about">About yourself</label><br />
        <textarea
          name="about"
          id="about"
          rows="4"
          cols="50"
          placeholder="Tell me about yourself..."
        ></textarea>
      </div>
      <div class="row justify-content-center">
        <button id="show" type="submit">Show my Info</button>
      </div>
    </div>

    <div id="modal" class="container">
      <div class="header mb">My Information</div>
      <div class="container justify-content-center">
        <p id="modalContent" class="mb"></p>
      </div>
      <div class="row justify-content-center">
        <button id="closeBtn">Close</button>
      </div>
    </div>

  </body>
</html>
